name: Build & Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-windows
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Set release tag environment
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Publishing release version $VERSION"
          echo "PACKAGE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Clean orphan & duplicate releases (Pre-publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/clean-duplicate-releases.js

      - name: Package Electron & Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish always

      - name: Clean orphan & duplicate releases (Post-publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/clean-duplicate-releases.js
