<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Main Habix Brand Gradient (Indigo -> Purple -> Pink) -->
    <linearGradient id="habixGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="45%" stop-color="#7c3aed" />
      <stop offset="85%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Flame / Checkmark Accent Glow -->
    <linearGradient id="flameAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Inner Core Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="256" cy="256" r="210" fill="url(#centerGlow)" />

  <!-- App Icon Squircle Background -->
  <rect
    x="32"
    y="32"
    width="448"
    height="448"
    rx="112"
    fill="url(#bgGrad)"
    stroke="url(#habixGrad)"
    stroke-width="5"
    stroke-opacity="0.35"
  />

  <!-- Subtle Inner Border Highlight -->
  <rect
    x="36"
    y="36"
    width="440"
    height="440"
    rx="108"
    fill="none"
    stroke="#ffffff"
    stroke-width="1.5"
    stroke-opacity="0.08"
  />

  <!-- The Stylized "H" + Flame + Checkmark Glyph -->
  <g filter="url(#logoGlow)">
    <!-- Left Pillar of "H" (Clean rounded vertical bar) -->
    <rect
      x="124"
      y="126"
      width="56"
      height="260"
      rx="28"
      fill="url(#habixGrad)"
    />

    <!-- Left Pillar Inner Glow Accent -->
    <rect
      x="132"
      y="136"
      width="14"
      height="140"
      rx="7"
      fill="#ffffff"
      fill-opacity="0.22"
    />

    <!-- Central Bridge + Right Rising Flame / Checkmark Swoosh -->
    <!-- Connects the left pillar horizontally, swoops through the center, and arcs up into an energetic checkmark-flame wing -->
    <path
      d="M172 232
         C195 232 216 235 240 248
         L258 259
         C280 272 296 288 312 312
         C330 262 360 196 400 134
         C406 124 414 122 418 132
         C422 142 418 156 410 172
         C374 246 342 322 322 376
         C316 392 302 400 286 398
         C272 396 260 384 250 368
         L226 332
         C214 314 196 302 172 298
         Z"
      fill="url(#habixGrad)"
    />

    <!-- Dynamic Flame Spark / Inner Check Accent on Right Wing -->
    <path
      d="M294 330
         C316 270 348 206 384 152
         C372 188 348 248 334 290
         C324 320 310 344 298 358
         C292 352 290 340 294 330
         Z"
      fill="url(#flameAccent)"
    />
  </g>

  <!-- Central Energy Sparkle Dot -->
  <circle cx="218" cy="214" r="8" fill="#ffffff" fill-opacity="0.85" />
</svg>
